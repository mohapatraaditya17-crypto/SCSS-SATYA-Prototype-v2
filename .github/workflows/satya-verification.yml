name: SATYA verification

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "remediation/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt
      - name: Run unit, applicability, API and integration suites
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests
      - name: Generate historical operational baseline
        env:
          PYTHONPATH: .
        run: python -m app.evaluation.evaluate_historical_run
      - name: Start API and run the six paired Samples
        env:
          PYTHONPATH: .
        shell: bash
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/satya-api.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/api/health > /dev/null; then
              break
            fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:8000/api/health
          python -m app.evaluation.run_paired_samples
      - name: Upload operational baseline outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: satya-operational-baselines
          path: |
            storage/reports/historical_operational_baseline.json
            storage/reports/historical_operational_baseline.md
            storage/reports/paired_samples_operational_baseline.json
          if-no-files-found: warn

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install frontend dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck and build
        run: npm run build
